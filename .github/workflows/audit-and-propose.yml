name: Audit and Propose

on:
  workflow_dispatch:
    inputs:
      audit_scope:
        description: 'What to audit (e.g. latest constitution files)'
        required: false
        default: 'full'
        type: choice
        options:
          - full

permissions:
  contents: read

concurrency:
  group: audit-and-propose-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate scope and write report
        env:
          AUDIT_SCOPE: ${{ inputs.audit_scope }}
        run: |
          case "$AUDIT_SCOPE" in
            full)
              ;;
            *)
              printf '%s\n' "Rejected audit_scope." >&2
              exit 1
              ;;
          esac
          printf '%s\n' "$AUDIT_SCOPE"
          printf '%s\n' "Findings summary"
          printf '%s\n' "- Example improvement 1"
          printf '%s\n' "- Example improvement 2"
